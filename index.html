<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple pomodoro timer</title>
</head>

<body>
  <div class="container">
    <div class="mode">
      <button id="work" class="active" onclick="setWorkTime()">25 min</button>
      <button id="short" onclick="setShortBreak()">5 min</button>
      <button id="long" onclick="setLongBreak()">15 min</button>
    </div>
    <div class="clock">
      <div id="minutes">25</div>
      <div>:</div>
      <div id="seconds">00</div>
    </div>
    <div class="controls">
      <button id="start" value="start" onclick="onStartClick()">Start</button>
      <button id="theme" onclick="onThemeClick()">🌞/🌒</button>
    </div>
    <div class="fullscreen">
      <button onclick="toggleFullScreen()">fullscreen mode</button>
    </div>
  </div>

</body>
<style>
  :root {
    --text-color: black;
    --bg-color: white;
  }

  :root.dark {
    --text-color: rgba(255, 255, 255, 0.75);
    --bg-color: black;

    .clock {
      font-weight: 100;
    }

    button {
      border: none;
      background: none;
      font-weight: 200;


      &.active {
        color: var(--text-color);
        font-weight: 600;
      }
    }
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: Arial, sans-serif;
    margin: 0;
    transition: background 0.5s, color 0.5s;
  }

  button {
    background: var(--bg-color);
    color: var(--text-color);
    margin: 5px;
    font-size: 18px;
    cursor: pointer;
    border: 2px solid var(--text-color);
    border-radius: 2px;

    &.active {
      background: var(--text-color);
      color: var(--bg-color);
    }
    &#theme {
      border: none;
    }
  }

  #start {
    min-width: 68px;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    justify-content: center;
  }

  .clock {
    font-size: 72px;
    font-weight: bold;
    margin: 20px 0;
    display: flex;

    #minutes,
    #seconds {
      width: 80px;
    }
  }

  .fullscreen {
    margin-top: 80px;

    button {
      font-size: 12px;
      font-weight: 500;
    }

  }
</style>
<script>
  let timerId;
  let wakeLock;

  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) {
    document.documentElement.classList.add(savedTheme);
  } else {
    document.documentElement.classList.add('light');
  }

  let activeMode = 'work'; // work, long, short

  const workBtn = document.getElementById("work");
  const shortBreakBtn = document.getElementById("short");
  const longBreakBtn = document.getElementById("long");
  const startBtn = document.getElementById("start");
  const minutes = document.getElementById("minutes");
  const seconds = document.getElementById("seconds");

  function setWorkTime() {
    activeMode = 'work';
    workBtn.classList.add("active");
    longBreakBtn.classList.remove("active");
    shortBreakBtn.classList.remove("active");
    setTime('25', '00');
  }
  
  function setShortBreak() {
    activeMode = 'short';
    workBtn.classList.remove("active");
    longBreakBtn.classList.remove("active");
    shortBreakBtn.classList.add("active");
    setTime('05', '00');
  }
  
  function setLongBreak() {
    activeMode = 'long';
    workBtn.classList.remove("active");
    longBreakBtn.classList.add("active");
    shortBreakBtn.classList.remove("active");
    setTime('15', '00');
  }
  
  // function onRestartClick() {
  //   if (activeMode === 'work') {
  //     setWorkTime();
  //   } else if (activeMode === 'short') {
  //     setShortBreak();
  //   } else {
  //     setLongBreak();
  //   }
  // }
  
  function onThemeClick() {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  }
  
  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }

  function onStartClick() {
    const action = startBtn.innerText === "Start" ? "start" : "pause";
    action === "start" ? (startBtn.innerText = "Pause") : (startBtn.innerText = "Start");
    if (action === "start") {
      setWakeLock()
      timerId = setInterval(() => {
        if (seconds.innerText !== "00") {
          seconds.innerText = (+seconds.innerText - 1).toString().padStart(2, '0');
        } else if (minutes.innerText !== "00") {
          minutes.innerText = (+minutes.innerText - 1).toString().padStart(2, '0');
          seconds.innerText = "59";
        } else {
          clearInterval(timerId);
          startBtn.innerText = "Start";
        }
      }, 1000);
    } else {
      resetTimer()
    }
  }

  function setWakeLock() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(wl => {
        wakeLock = wl;
        wakeLock.addEventListener('release', () => {
          console.log('Wake Lock was released');
        });
      })
    }
  }

  function resetTimer() {
    clearInterval(timerId);
    if (wakeLock) {
      wakeLock.release();
      wakeLock = null;
    }
  }

  function setTime(m, s) {
    const minutes = document.getElementById("minutes");
    const seconds = document.getElementById("seconds");
    minutes.innerText = m;
    seconds.innerText = s;
  };
</script>

</html>
