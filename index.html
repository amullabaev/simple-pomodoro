<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple pomodoro timer</title>
  <link rel="stylesheet" href="style.css" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#808080" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pomodoro" />
</head>
<script>
  const savedTheme = localStorage.getItem('theme');
  document.documentElement.classList.add(savedTheme ?? 'light');
</script>

<body>
  <div class="container">
    <div class="mode">
      <button id="work" value="1500" class="active" onclick="setMode(this)">25 min</button>
      <button id="short" value="300" onclick="setMode(this)">5 min</button>
      <button id="long" value="900" onclick="setMode(this)">15 min</button>
    </div>
    <div class="clock">
      <div id="hours" hidden>00</div>
      <div id="minutes">25</div>
      <div id="seconds">00</div>
    </div>

    <progress id="progress" max="100" value="100"></progress>

    <p>Cycles finished today: <span id="finishedCyclesCount"></span></p>

    <div class="controls">
      <button id="start" value="start" onclick="onStartPauseClick(this.value)">Start</button>
      <button id="displayMode" value="mm:ss" onclick="onDisplayModeChange(this.value)">mm:ss</button>
      <button id="theme" onclick="onThemeClick()">🌞/🌒</button>
    </div>
    <div class="fullscreen">
      <button onclick="toggleFullScreen()">fullscreen mode</button>
    </div>
  </div>
  <script src="index.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
